name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_ABI: arm64-v8a
  ANDROID_PLATFORM: android-24
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    name: Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Validate manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text())

          assert manifest["type"] == "preload-native"
          assert manifest["entry"] == "liblevi_visuals.so"
          assert manifest["minecraft_versions"] == ["1.26.44.3"]

          print("manifest.json: OK")
          PY

      - name: Configure
        shell: bash
        run: |
          "${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin/cmake" \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MAKE_PROGRAM="${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin/ninja" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}"

      - name: Build
        shell: bash
        run: |
          "${ANDROID_SDK_ROOT}/cmake/${CMAKE_VERSION}/bin/cmake" \
            --build build \
            --target levi_visuals \
            --parallel 2

      - name: Validate native library
        shell: bash
        run: |
          test -f build/liblevi_visuals.so

          readelf -h build/liblevi_visuals.so \
            | grep -q "AArch64"

          readelf -Ws build/liblevi_visuals.so \
            | grep -q "PLGetModRegistration"

          readelf -d build/liblevi_visuals.so \
            | grep -q "libpreloader.so"

          alignments="$(
            readelf -lW build/liblevi_visuals.so \
              | awk '$1 == "LOAD" {print $NF}' \
              | sort -u
          )"

          test "${alignments}" = "0x4000"

      - name: Create LeviPack
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"

          mkdir -p package

          cp manifest.json package/manifest.json
          cp build/liblevi_visuals.so package/liblevi_visuals.so

          cd package
          zip -r "../LeviVisuals-${short_sha}.levipack" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeviVisuals-${{ github.sha }}
          path: LeviVisuals-*.levipack
          if-no-files-found: error
